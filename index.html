<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        #jsdos-container {
            position: relative;
            width: 640px;
            height: 480px;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #loading-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="jsdos-container">
        <canvas id="jsdos"></canvas>
        <div id="loading-status">
            <p>게임 파일을 불러오는 중...</p>
            <p><span id="progress-value">0</span>%</p>
        </div>
    </div>

    <script src="https://js-dos.com/v7/js-dos.js"></script>
    <script>
        const canvas = document.getElementById("jsdos");
        const loadingStatus = document.getElementById("loading-status");
        const progressValue = document.getElementById("progress-value");

        Dos(canvas, {
            onprogress: (stage, total, current) => {
                if (stage === "download") {
                    const percentage = Math.round(current / total * 100);
                    progressValue.innerText = percentage;
                }
                if (stage === "unzip") {
                    loadingStatus.innerHTML = "<p>압축 해제 중...</p>";
                }
                 if (stage === "run") {
                    loadingStatus.style.display = "none";
                }
            }
        }).ready((fs, main) => {
            main(["-c", "mount c .", "-c", "c:", "-c", "SAN3.EXE"])
              .then(ci => {
                 ci.install("https://raw.githubusercontent.com/dj288377/dj288377/sub/sam3.zip", "/");
                 return ci.run();
              });
        });
    </script>
</body>
</html>
